
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - CLKT</title>

</head>


<body>

    <main>

        <img
            src="https://abdikarim-mohamud-ali.github.io/CLKT-ASSETS/clkt-logo.svg"
            alt="CLKT"
            width="100"
        >


        <h1>
            Reset your password
        </h1>


        <p>
            Enter the verification code sent to your email
            and choose a new password.
        </p>


        <form id="resetPasswordForm">


            <label for="code">
                Verification code
            </label>


            <input
                type="text"
                id="code"
                placeholder="000000"
                maxlength="6"
                inputmode="numeric"
                autocomplete="one-time-code"
                required
            >


            <label for="newPassword">
                New password
            </label>


            <input
                type="password"
                id="newPassword"
                placeholder="New password"
                required
            >


            <label for="confirmPassword">
                Confirm new password
            </label>


            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                required
            >


            <button
                type="submit"
                id="resetButton"
            >
                Reset password
            </button>


            <p id="message"></p>


        </form>


        <a href="login.html">
            Back to login
        </a>


    </main>


    <script src="reset-password.js"></script>

</body>

</html>
