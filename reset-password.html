
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - CLKT</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 24px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f5f5f5;

            color:
                #171717;

        }


        main {

            width: 100%;

            max-width: 430px;

            background:
                white;

            padding: 42px 36px;

            border-radius: 18px;

            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.08);

        }


        .logo {

            display: block;

            width: 105px;

            margin:
                0 auto 30px;

        }


        h1 {

            margin:
                0 0 10px;

            text-align: center;

            font-size: 28px;

            font-weight: 700;

        }


        .description {

            margin:
                0 0 30px;

            text-align: center;

            color:
                #666;

            font-size: 15px;

            line-height: 1.5;

        }


        .form-group {

            margin-bottom: 20px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 600;

        }


        input {

            width: 100%;

            height: 50px;

            padding:
                0 14px;

            border:
                1px solid #d6d6d6;

            border-radius:
                10px;

            outline: none;

            font-size: 16px;

            background:
                white;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;

        }


        input:focus {

            border-color:
                #e00000;

            box-shadow:
                0 0 0 3px
                rgba(224, 0, 0, 0.10);

        }


        #code {

            text-align: center;

            letter-spacing:
                8px;

            font-size: 22px;

            font-weight: 600;

        }


        button {

            width: 100%;

            height: 50px;

            border: none;

            border-radius:
                10px;

            background:
                #e00000;

            color:
                white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.1s;

        }


        button:hover {

            background:
                #c90000;

        }


        button:active {

            transform:
                scale(0.99);

        }


        button:disabled {

            opacity:
                0.6;

            cursor:
                not-allowed;

        }


        #verifyButton {

            margin-top: 4px;

        }


        #resetButton {

            margin-top: 4px;

        }


        #message {

            min-height:
                22px;

            margin:
                18px 0 0;

            text-align:
                center;

            color:
                #555;

            font-size:
                14px;

            line-height:
                1.4;

        }


        .back-login {

            display: block;

            margin-top:
                24px;

            text-align:
                center;

            color:
                #e00000;

            text-decoration:
                none;

            font-size:
                14px;

            font-weight:
                600;

        }


        .back-login:hover {

            text-decoration:
                underline;

        }


        @media (max-width: 480px) {

            body {

                padding:
                    16px;

            }


            main {

                padding:
                    34px 24px;

                border-radius:
                    14px;

            }


            h1 {

                font-size:
                    25px;

            }

        }

    </style>

</head>


<body>


    <main>


        <img
            class="logo"
            src="https://abdikarim-mohamud-ali.github.io/CLKT-ASSETS/clkt-logo.svg"
            alt="CLKT"
        >


        <h1>
            Reset your password
        </h1>


        <p class="description">
            Enter the verification code sent to your email.
        </p>


        <form id="resetPasswordForm">


            <div class="form-group">

                <label for="code">
                    Verification code
                </label>


                <input
                    type="text"
                    id="code"
                    placeholder="000000"
                    maxlength="6"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    required
                >

            </div>


            <div class="form-group">

                <label for="newPassword">
                    New password
                </label>


                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter your new password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm new password
                </label>


                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Enter your new password again"
                    required
                >

            </div>


            <button
                type="submit"
                id="resetButton"
            >
                Confirm password
            </button>


            <p id="message"></p>


        </form>


        <a
            class="back-login"
            href="login.html"
        >
            Back to login
        </a>


    </main>


    <script src="reset-password.js"></script>


</body>

</html>
