
<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">


<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Verify Email - CLKT</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family:
            Arial,
            Helvetica,
            sans-serif;
        background: #f5f5f5;
        color: #171717;
    }

    main {
        width: 100%;
        max-width: 430px;
        background: white;
        padding: 42px 36px;
        border-radius: 18px;
        box-shadow:
            0 12px 35px
            rgba(0, 0, 0, 0.08);
        text-align: center;
    }

    .logo {
        width: 105px;
        display: block;
        margin: 0 auto 30px;
    }

    h1 {
        margin: 0 0 10px;
        font-size: 28px;
    }

    .description {
        margin: 0 0 28px;
        color: #666;
        font-size: 15px;
        line-height: 1.5;
    }

    .email-display {
        margin: 0 0 24px;
        padding: 12px;
        background: #f7f7f7;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        word-break: break-word;
    }

    .form-group {
        margin-bottom: 18px;
        text-align: left;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 600;
    }

    input {
        width: 100%;
        height: 52px;
        padding: 0 14px;
        border: 1px solid #d6d6d6;
        border-radius: 10px;
        outline: none;
        font-size: 20px;
        text-align: center;
        letter-spacing: 8px;
    }

    input:focus {
        border-color: #e00000;
        box-shadow:
            0 0 0 3px
            rgba(224, 0, 0, 0.10);
    }

    button {
        width: 100%;
        height: 50px;
        border: none;
        border-radius: 10px;
        background: #e00000;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }

    button:hover {
        background: #c90000;
    }

    button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .secondary-button {
        margin-top: 12px;
        background: #eeeeee;
        color: #222;
    }

    .secondary-button:hover {
        background: #dddddd;
    }

    #message {
        min-height: 22px;
        margin: 18px 0 0;
        font-size: 14px;
        line-height: 1.4;
    }

    .back-login {
        display: block;
        margin-top: 24px;
        color: #e00000;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
    }

    .back-login:hover {
        text-decoration: underline;
    }

    @media (max-width: 480px) {
        body {
            padding: 16px;
        }

        main {
            padding: 34px 24px;
        }

        h1 {
            font-size: 25px;
        }
    }
</style>


</head>

<body>


<main>

    <img
        class="logo"
        src="https://abdikarim-mohamud-ali.github.io/CLKT-ASSETS/clkt-logo.svg"
        alt="CLKT"
    >

    <h1>
        Verify your email
    </h1>

    <p class="description">
        Enter the 6-digit code we sent to your email.
    </p>

    <div
        class="email-display"
        id="emailDisplay"
    >
        Loading...
    </div>

    <form id="verifyForm">

        <div class="form-group">

            <label for="code">
                Verification code
            </label>

            <input
                type="text"
                id="code"
                placeholder="000000"
                maxlength="6"
                inputmode="numeric"
                autocomplete="one-time-code"
                required
            >

        </div>

        <button
            type="submit"
            id="verifyButton"
        >
            Verify email
        </button>

        <button
            type="button"
            class="secondary-button"
            id="resendButton"
        >
            Resend verification code
        </button>

        <p id="message"></p>

    </form>

    <a
        class="back-login"
        href="login.html"
    >
        Back to login
    </a>

</main>

<script src="verify.js"></script>


</body>

</html>
