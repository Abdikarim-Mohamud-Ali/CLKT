<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact CLKT</title>


<style>

    * {
        box-sizing: border-box;
    }


    body {
        margin: 0;

        min-height: 100vh;

        font-family: Arial, Helvetica, sans-serif;

        background: #f5f5f5;

        color: #222;

        display: flex;

        justify-content: center;

        align-items: center;

        padding: 30px;
    }


    /* MAIN CONTAINER */

    .contact-container {
        width: 100%;

        max-width: 650px;
    }


    /* CONTACT CARD */

    .contact-card {
        background: #ffffff;

        padding: 40px;

        border-radius: 18px;

        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }


    /* LOGO */

    .logo {
        display: block;

        width: 85px;

        height: auto;

        margin: 0 auto 25px;
    }


    /* HEADING */

    h1 {
        margin: 0 0 10px;

        text-align: center;

        font-size: 30px;
    }


    .intro {
        margin: 0 auto 30px;

        max-width: 500px;

        text-align: center;

        color: #777;

        font-size: 15px;

        line-height: 1.6;
    }


    /* FORM */

    label {
        display: block;

        margin-bottom: 7px;

        font-size: 14px;

        font-weight: 600;
    }


    input,
    textarea {
        width: 100%;

        padding: 13px 14px;

        margin-bottom: 20px;

        border: 1px solid #d8d8d8;

        border-radius: 8px;

        font-family: inherit;

        font-size: 15px;

        outline: none;

        transition: border-color 0.2s;
    }


    input:focus,
    textarea:focus {
        border-color: #E00000;
    }


    textarea {
        min-height: 150px;

        resize: vertical;
    }


    /* BUTTON */

    button {
        width: 100%;

        padding: 14px;

        border: none;

        border-radius: 8px;

        background: #E00000;

        color: white;

        font-size: 16px;

        font-weight: 700;

        cursor: pointer;

        transition: background 0.2s;
    }


    button:hover {
        background: #c90000;
    }


    /* CONTACT INFORMATION */

    .contact-info {
        margin-top: 30px;

        padding-top: 25px;

        border-top: 1px solid #eeeeee;

        text-align: center;
    }


    .contact-info h2 {
        margin: 0 0 10px;

        font-size: 18px;
    }


    .contact-info p {
        margin: 0;

        color: #777;

        font-size: 14px;

        line-height: 1.6;
    }


    .contact-info a {
        color: #E00000;

        text-decoration: none;

        font-weight: 600;
    }


    .contact-info a:hover {
        text-decoration: underline;
    }


    /* DEVELOPER CREDIT */

    .developer-credit {
        position: fixed;

        right: 20px;

        bottom: 15px;

        margin: 0;

        font-size: 12px;

        color: #999;
    }


    .developer-credit a {
        color: #777;

        text-decoration: none;

        font-weight: 600;
    }


    .developer-credit a:hover {
        color: #E00000;

        text-decoration: underline;
    }


    /* MOBILE */

    @media (max-width: 600px) {

        body {
            padding: 20px;
        }


        .contact-card {
            padding: 28px 22px;
        }


        h1 {
            font-size: 25px;
        }


        .developer-credit {
            right: 12px;

            bottom: 10px;

            font-size: 11px;
        }

    }

</style>
```

</head>

<body>

```
<div class="contact-container">


    <div class="contact-card">


        <!-- CLKT LOGO -->

        <img
            src="images/clkt-logo.svg"
            alt="CLKT logo"
            class="logo"
        >


        <!-- TITLE -->

        <h1>
            Contact CLKT
        </h1>


        <p class="intro">
            Have a question, suggestion, or feedback?
            We'd love to hear from you.
        </p>


        <!-- CONTACT FORM -->

        <form>


            <label for="name">
                Name
            </label>


            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >


            <label for="email">
                Email
            </label>


            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="message">
                Message
            </label>


            <textarea
                id="message"
                name="message"
                placeholder="Write your message..."
                required
            ></textarea>


            <button type="submit">
                Send message
            </button>


        </form>


        <!-- CONTACT INFORMATION -->

        <div class="contact-info">


            <h2>
                Get in touch
            </h2>


            <p>

                Email us at

                <a href="mailto:abdikarim.online.services@gmail.com">
                    abdikarim.online.services@gmail.com
                </a>

            </p>


        </div>


    </div>


</div>


<!-- DEVELOPER CREDIT -->

<p class="developer-credit">

    Developed by

    <a
        href="https://github.com/Abdikarim-Mohamud-Ali"
        target="_blank"
        rel="noopener noreferrer"
    >
        Abdikarim Mohamud
    </a>

</p>
```

</html>
