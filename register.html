<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create your CLKT account</title>

<style>

    * {
        box-sizing: border-box;
    }


    body {
        margin: 0;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background: #f5f5f5;

        font-family: Arial, Helvetica, sans-serif;

        color: #222;
    }


    .container {
        width: 100%;
        max-width: 430px;

        padding: 20px;
    }


    .card {
        background: white;

        padding: 25px 35px 30px;

        border-radius: 16px;

        box-shadow:
            0 8px 30px rgba(0, 0, 0, 0.08);
    }


    /* CLKT LOGO */

    .brand {
        text-align: center;

        margin-bottom: 20px;
    }


    .logo {
        width: 115px;
        height: auto;

        display: block;

        margin: 0 auto;
    }


    h1 {
        margin: 0 0 8px;

        font-size: 25px;

        text-align: center;
    }


    .subtitle {
        margin: 0 0 28px;

        text-align: center;

        color: #777;

        font-size: 14px;

        line-height: 1.5;
    }


    label {
        display: block;

        margin-bottom: 7px;

        font-size: 14px;

        font-weight: 600;
    }


    input {
        width: 100%;

        padding: 13px 14px;

        margin-bottom: 18px;

        border: 1px solid #d8d8d8;

        border-radius: 8px;

        font-size: 15px;

        outline: none;

        transition: border-color 0.2s;
    }


    input:focus {
        border-color: #E00000;
    }


    button {
        width: 100%;

        padding: 14px;

        border: none;

        border-radius: 8px;

        background: #E00000;

        color: white;

        font-size: 16px;

        font-weight: 700;

        cursor: pointer;

        transition: background 0.2s;
    }


    button:hover {
        background: #b80000;
    }


    #message {
        margin: 18px 0 0;

        text-align: center;

        font-size: 14px;

        line-height: 1.5;
    }


    .footer {
        margin-top: 22px;

        text-align: center;

        color: #999;

        font-size: 12px;
    }

</style>

</head>

<body>

<div class="container">


<div class="card">


    <!-- CLKT LOGO -->

    <div class="brand">

        <img
            src="https://abdikarim-mohamud-ali.github.io/CLKT-ASSETS/clkt-logo.svg"
            alt="CLKT logo"
            class="logo"
        >

    </div>


    <!-- REGISTRATION -->

    <h1>
        Create your account
    </h1>


    <p class="subtitle">
        Join CLKT and connect through voice, conversations and community.
    </p>


    <form id="registerForm">


        <label for="name">
            Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Create a password"
            required
        >


        <button type="submit">
            Create account
        </button>

    </form>


    <p id="message"></p>


    <div class="footer">
        © 2026 CLKT. All rights reserved.
    </div>


</div>


</div>

<script src="register.js"></script>

</body>

</html>
