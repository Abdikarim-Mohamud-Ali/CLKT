<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - CLKT</title>

</head>


<body>

    <main>

        <img
            src="https://abdikarim-mohamud-ali.github.io/CLKT-ASSETS/clkt-logo.svg"
            alt="CLKT"
            width="100"
        >

        <h1>Forgot your password?</h1>

        <p>
            Enter your email or username to reset your password.
        </p>


        <form id="forgotPasswordForm">

            <label for="login">
                Email or username
            </label>

            <input
                type="text"
                id="login"
                placeholder="Email or username"
                required
            >


            <button
                type="submit"
                id="continueButton"
            >
                Continue
            </button>


            <p id="message"></p>

        </form>


        <a href="login.html">
            Back to login
        </a>

    </main>


    <script src="forgot-password.js"></script>

</body>

</html>
