<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 440" width="100%" height="100%">

  <style>

    .red-bg {
      fill: #E00000;
    }

    .mark-fill {
      fill: #FFFFFF;
    }

  </style>

  <!-- Red Rounded Square Logo Mark -->

<rect
 x="50"
 y="20"
 width="400"
 height="400"
 rx="48"
 ry="48"
 class="red-bg"
/>

  <!-- Integrated C Symbol -->

<path
 class="mark-fill"
 d="M 355 140
    A 135 135 0 1 0 355 300
    L 300 252
    A 68 68 0 1 1 300 188
    Z"
/>

  <!-- Center Standing Microphone -->

<rect
 x="236"
 y="160"
 width="28"
 height="46"
 rx="14"
 ry="14"
 class="mark-fill"
/>

  <!-- Microphone Grille Slots -->

<rect
 x="241"
 y="172"
 width="18"
 height="3"
 rx="1.5"
 class="red-bg"
/>

<rect
 x="241"
 y="179"
 width="18"
 height="3"
 rx="1.5"
 class="red-bg"
/>

<rect
 x="241"
 y="186"
 width="18"
 height="3"
 rx="1.5"
 class="red-bg"
/>

  <!-- U-Shaped Bracket -->

<path
 d="M 226 182 A 24 24 0 0 0 274 182"
 fill="none"
 stroke="#FFFFFF"
 stroke-width="6"
 stroke-linecap="round"
/>

  <!-- Mic Stand Stem -->

<line
 x1="250"
 y1="206"
 x2="250"
 y2="235"
 stroke="#FFFFFF"
 stroke-width="6"
 stroke-linecap="round"
/>

  <!-- Mic Stand Base -->

<rect
 x="232"
 y="233"
 width="36"
 height="6"
 rx="3"
 ry="3"
 class="mark-fill"
/>

</svg>

