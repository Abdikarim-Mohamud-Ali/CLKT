
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Log in to CLKT</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #f5f5f5;

            font-family: Arial, Helvetica, sans-serif;

            color: #222;

        }


        .container {

            width: 100%;

            max-width: 430px;

            padding: 20px;

        }


        .card {

            background: white;

            padding: 25px 35px 30px;

            border-radius: 16px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.08);

        }


        .brand {

            text-align: center;

            margin-bottom: 20px;

        }


        .logo {

            width: 115px;

            height: auto;

            display: block;

            margin: 0 auto;

        }


        h1 {

            margin: 0 0 8px;

            font-size: 25px;

            text-align: center;

        }


        .subtitle {

            margin: 0 0 28px;

            text-align: center;

            color: #777;

            font-size: 14px;

            line-height: 1.5;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 600;

        }


        input {

            width: 100%;

            padding: 13px 14px;

            margin-bottom: 18px;

            border: 1px solid #d8d8d8;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            transition: border-color 0.2s;

        }


        input:focus {

            border-color: #e00000;

        }


        .forgot-password {

            display: block;

            margin-top: -8px;

            margin-bottom: 18px;

            text-align: right;

            color: #e00000;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

        }


        .forgot-password:hover {

            text-decoration: underline;

        }


        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #e00000;

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition: background 0.2s;

        }


        button:hover {

            background: #b80000;

        }


        button:disabled {

            background: #999;

            cursor: not-allowed;

        }


        #message {

            margin: 18px 0 0;

            text-align: center;

            font-size: 14px;

            line-height: 1.5;

        }


        .register-link {

            margin-top: 20px;

            text-align: center;

            font-size: 14px;

            color: #777;

        }


        .register-link a {

            color: #e00000;

            text-decoration: none;

            font-weight: 600;

        }


        .register-link a:hover {

            text-decoration: underline;

        }


        .footer {

            margin-top: 22px;

            text-align: center;

            color: #999;

            font-size: 12px;

        }

    </style>

</head>


<body>


    <div class="container">


        <div class="card">


            <div class="brand">

                <img
                    src="https://abdikarim-mohamud-ali.github.io/CLKT-ASSETS/clkt-logo.svg"
                    alt="CLKT logo"
                    class="logo"
                >

            </div>


            <h1>
                Welcome back
            </h1>


            <p class="subtitle">
                Log in to continue to CLKT.
            </p>


            <form id="loginForm">


                <label for="login">
                    Email or username
                </label>


                <input
                    type="text"
                    id="login"
                    placeholder="Enter your email or username"
                    autocomplete="username"
                    required
                >


                <label for="password">
                    Password
                </label>


                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >


                <a
                    href="forgot-password.html"
                    class="forgot-password"
                >
                    Forgot password?
                </a>


                <button
                    type="submit"
                    id="loginButton"
                >
                    Log in
                </button>


            </form>


            <p id="message"></p>


            <div class="register-link">

                Don't have an account?

                <a href="register.html">
                    Create one
                </a>

            </div>


            <div class="footer">

                © 2026 CLKT. All rights reserved.

            </div>


        </div>


    </div>


    <script src="login.js"></script>


</body>

</html>
